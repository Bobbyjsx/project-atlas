name: Build and Push Sidecars to GCR

on:
  push:
    branches:
      - main
    paths:
      - 'service-manifest.yaml'
      - 'deployment/**'
      - 'runtime/**'
      - '.github/workflows/sidecar-ci.yml'
  workflow_dispatch:

env:
  REGISTRY: gcr.io
  GCP_PROJECT_ID: project-atlas-501612

jobs:
  parse-manifest:
    name: Parse Service Manifest
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read manifest and output JSON matrix
        id: set-matrix
        run: |
          SERVICES_JSON=$(yq -o=json '[.services | to_entries | .[] | {"name": .key, "version": .value.version, "repo": .value.repo, "branch": .value.branch, "secret": .value.secret}]' service-manifest.yaml | jq -c .)
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build ${{ matrix.service.name }} (${{ matrix.service.version }})
    needs: parse-manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.parse-manifest.outputs.services) }}

    steps:
      - name: Checkout Atlas runtime
        uses: actions/checkout@v4
        with:
          path: ./atlas

      - name: Prepare Atlas runtime
        working-directory: ./atlas/runtime
        run: |
          cp entrypoint.py ../../atlas-runtime
          chmod +x ../../atlas-runtime

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use GCR
        run: gcloud auth configure-docker gcr.io

      - name: Set image names
        id: images
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          SERVICE_VERSION: ${{ matrix.service.version }}
        run: |
          echo "base=${REGISTRY}/${GCP_PROJECT_ID}/${SERVICE_NAME}:${SERVICE_VERSION}-base" >> "$GITHUB_OUTPUT"
          echo "final=${REGISTRY}/${GCP_PROJECT_ID}/${SERVICE_NAME}:${SERVICE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if base image already exists
        id: check-base
        env:
          IMAGE_NAME: ${{ steps.images.outputs.base }}
        run: |
          if docker manifest inspect "$IMAGE_NAME" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout external repository (${{ matrix.service.repo }})
        if: steps.check-base.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.service.repo }}
          ref: ${{ matrix.service.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          path: './src'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application base image
        if: steps.check-base.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./src
          push: true
          tags: ${{ steps.images.outputs.base }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create runtime wrapper Dockerfile
        env:
          BASE_IMAGE: ${{ steps.images.outputs.base }}
        run: |
          docker pull $BASE_IMAGE
          python3 -c '
          import sys, json, subprocess
          base_image = sys.argv[1]
          out = subprocess.check_output(["docker", "inspect", base_image])
          config = json.loads(out)[0]["Config"]
          entrypoint = config.get("Entrypoint") or []
          cmd = config.get("Cmd") or []
          full_cmd = entrypoint + cmd
          with open("Dockerfile.atlas-runtime", "w") as f:
              f.write("ARG BASE_IMAGE\n")
              f.write(f"FROM {base_image}\n")
              f.write("COPY atlas-runtime /usr/local/bin/atlas-runtime\n")
              f.write("ENTRYPOINT [\"/usr/local/bin/atlas-runtime\"]\n")
              f.write(f"CMD {json.dumps(full_cmd)}\n")
          ' "$BASE_IMAGE"

      - name: Build and push Atlas-enabled image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.atlas-runtime
          build-args: |
            BASE_IMAGE=${{ steps.images.outputs.base }}
          push: true
          tags: ${{ steps.images.outputs.final }}

  deploy:
    name: Deploy to Cloud Run (${{ matrix.region }})
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [africa-south1]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update deployment manifest with image versions and secret bundles
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
        run: |
          export ATLAS_VERSION=$(yq '.services."project-atlas".version // "latest"' service-manifest.yaml)
          export ATLAS_SECRET=$(yq '.services."project-atlas".secret' service-manifest.yaml)
          export KEYSENTRY_VERSION=$(yq '.services."keysentry-api".version // "latest"' service-manifest.yaml)
          export KEYSENTRY_SECRET=$(yq '.services."keysentry-api".secret' service-manifest.yaml)
          export COGNITO_VERSION=$(yq '.services."cognito-api".version // "latest"' service-manifest.yaml)
          export COGNITO_SECRET=$(yq '.services."cognito-api".secret' service-manifest.yaml)
          export IDENTITY_SERVICE_VERSION=$(yq '.services."identity-service".version // "latest"' service-manifest.yaml)
          export IDENTITY_SERVICE_SECRET=$(yq '.services."identity-service".version // "latest"' service-manifest.yaml)

          test -n "$ATLAS_SECRET" && test "$ATLAS_SECRET" != "null"
          test -n "$KEYSENTRY_SECRET" && test "$KEYSENTRY_SECRET" != "null"
          test -n "$COGNITO_SECRET" && test "$COGNITO_SECRET" != "null"
          test -n "$IDENTITY_SERVICE_SECRET" && test "$COGNITO_SECRET" != "null"

          envsubst < deployment/cloudrun-service.yaml > deployment/cloudrun-service-applied.yaml

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace deployment/cloudrun-service-applied.yaml --region ${{ matrix.region }}
