apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: project-atlas
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/github-run-id: "${GITHUB_RUN_ID}"
        # Crucial: enable multiple containers
        run.googleapis.com/container-dependencies: '{"atlas-gateway": ["keysentry-sidecar", "cognito-sidecar"]}'
        # Direct VPC Egress to reach internal VM IPs (like the database at 10.218.0.2)
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
    spec:
      containers:
        # --- The Ingress Gateway Container ---
        - image: gcr.io/${GCP_PROJECT_ID}/project-atlas:${ATLAS_VERSION}
          name: atlas-gateway
          ports:
            - containerPort: 8080
          env:
            - name: ATLAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: ${ATLAS_SECRET}
                  key: latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"

        # --- Sidecar 1: KeySentry API ---
        - image: gcr.io/${GCP_PROJECT_ID}/keysentry-api:${KEYSENTRY_VERSION}
          name: keysentry-sidecar
          env:
            - name: PORT
              value: "8001"
            - name: ATLAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: ${KEYSENTRY_SECRET}
                  key: latest
          startupProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 2
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5

        # --- Sidecar 2: Cognito API ---
        - image: gcr.io/${GCP_PROJECT_ID}/cognito-api:${COGNITO_VERSION}
          name: cognito-sidecar
          env:
            - name: PORT
              value: "8002"
            - name: ATLAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: ${COGNITO_SECRET}
                  key: latest
          startupProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 2
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
